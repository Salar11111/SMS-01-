name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.runCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          MONGO_INTEGRATION: "1"
          MONGODB_URI: mongodb://127.0.0.1:27017/school-management-ci

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-32
          MONGODB_URI: mongodb://127.0.0.1:27017/school-management-ci

      - name: Seed demo school
        run: npx tsx src/lib/seed.ts
        env:
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-32
          MONGODB_URI: mongodb://127.0.0.1:27017/school-management

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Teacher attendance path
        run: npx playwright test tests/attendance.spec.ts
        env:
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-32
          MONGODB_URI: mongodb://127.0.0.1:27017/school-management
